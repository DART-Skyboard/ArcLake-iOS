name: ArcLake
options:
  bundleIdPrefix: com.dartmeadow
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true
  xcodeVersion: "15.4"
  xcodeCompatibilityVersion: "Xcode 14.0"
  # XcodeGen embeds an on-demand-install-capable dependency like a generic
  # app extension (PlugIns/) instead of the App-Clip-specific destination
  # Apple requires (AppClips/) — this patches the generated pbxproj to fix
  # that specific copy-files phase right after generation.
  postGenCommand: python3 scripts/fix_appclip_embed.py
packages:
  swift-markdown-ui:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
targets:
  ArcLakeClip:
    # This IS the field — "productType:" (used previously) isn't a real
    # XcodeGen key and was silently ignored, meaning this target has never
    # actually been an App Clip from Xcode's perspective in any previous
    # attempt. XcodeGen's own on-demand-install-capable handling (via
    # XcodeProj) should generate the correct "Embed App Clips" phase
    # automatically once this is set correctly, with no manual patching.
    type: application.on-demand-install-capable
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/ArcLakeClip
      - path: Sources/ArcLakeApp/Resources/ArcLakeLogo.png
        buildPhase: resources
      - path: Sources/ArcLakeApp/Resources/Orbitron-Regular.ttf
        buildPhase: resources
    info:
      path: Sources/ArcLakeClip/Info.plist
      properties:
        CFBundleDisplayName: Arc Lake
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Orbitron-Regular.ttf
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
    entitlements:
      path: Sources/ArcLakeClip/ArcLakeClip.entitlements
    settings:
      base:
        PRODUCT_NAME: "ArcLakeClip"
        PRODUCT_BUNDLE_IDENTIFIER: DART-Meadow-LLC.Cotharticren.Clip
        DEVELOPMENT_TEAM: L7AHWS9Q6V
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "ArcLakeClipGitHubFlow"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Sources/ArcLakeClip/ArcLakeClip.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "379"
        MARKETING_VERSION: "1.5.7"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"

  ArcLakeApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources/ArcLakeApp
      - Sources/ArcLakeApp/ArcLakeData.xcdatamodeld
      - Sources/ArcLakeApp/Resources
    info:
      path: Sources/ArcLakeApp/Info.plist
      properties:
        CFBundleDisplayName: Arc Lake
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        GIDClientID: "417023343630-uor82401j1d6q3cjroaibp90m61d9e28.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.417023343630-uor82401j1d6q3cjroaibp90m61d9e28"
        UIRequiresFullScreen: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Used for AR mode atom visualization
        NSPhotoLibraryAddUsageDescription: Save GLB exports and screenshots
        NSMicrophoneUsageDescription: Voice commands for the ArcLake lab assistant
        NSSpeechRecognitionUsageDescription: Autumn uses speech recognition to understand your voice commands for the ArcLake molecular lab
        UIAppFonts:
          - Orbitron-Regular.ttf
    entitlements:
      path: Sources/ArcLakeApp/ArcLakeApp.entitlements
    dependencies:
      - package: swift-markdown-ui
        product: MarkdownUI
        embed: false
        link: true
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: ModelIO.framework

    settings:
      base:
        PRODUCT_NAME: "Arc Lake"
        PRODUCT_BUNDLE_IDENTIFIER: DART-Meadow-LLC.Cotharticren
        DEVELOPMENT_TEAM: L7AHWS9Q6V
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "ArcLakeGitHubFlow"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Sources/ArcLakeApp/ArcLakeApp.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "379"
        MARKETING_VERSION: "1.5.7"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
schemes:
  ArcLakeApp:
    build:
      targets:
        ArcLakeApp: all
    archive:
      config: Release
  ArcLakeClip:
    build:
      targets:
        ArcLakeClip: all
    archive:
      config: Release

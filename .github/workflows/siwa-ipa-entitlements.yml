name: SIWA IPA entitlement proof

# Prove signed ArcLakeApp binary + embedded.mobileprovision both contain
# com.apple.developer.applesignin = ["Default"]. No TestFlight upload.

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref to archive"
        required: false
        default: ""
  push:
    branches: [siwa/packaging-applesignin-xcent]

jobs:
  prove:
    name: Dump IPA entitlements (no TF upload)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8
          KEY_SIZE=$(wc -c < ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8)
          echo "API key: $KEY_SIZE bytes"
          [ "$KEY_SIZE" -lt 100 ] && echo "ERROR: secret empty" && exit 1 || true

      - name: Setup keychain, install certificate and provisioning profile
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KP="${KEYCHAIN_PASSWORD:-keychainpass}"
          security create-keychain -p "$KP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KP" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${CERTIFICATE_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN_PATH"

          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --user --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyjwt cryptography || true
          PP_PATH="$RUNNER_TEMP/arclake.mobileprovision"
          python3 - "$PP_PATH" << 'PYEOF'
          import jwt, time, json, urllib.request, base64, sys, os
          key = open(os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8")).read()
          token = jwt.encode({"iss":"90056871-d791-45f6-a770-21399c45e491","iat":int(time.time()),
              "exp":int(time.time())+1200,"aud":"appstoreconnect-v1"}, key,
              algorithm="ES256", headers={"kid":"NQXQ595W59"})
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/profiles?filter[name]=ArcLakeAppStoreFlow",
              headers={"Authorization": f"Bearer {token}"})
          d = json.loads(urllib.request.urlopen(req).read())
          prof = d["data"][0]["attributes"]
          open(sys.argv[1], "wb").write(base64.b64decode(prof["profileContent"]))
          print(f"Fetched profile UUID: {prof['uuid']}")
          PYEOF
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(security cms -D -i "$PP_PATH" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || true)
          if [ -z "$PP_UUID" ]; then
            echo "ASC fetch failed — falling back to secret profile"
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
            PP_UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          fi
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID.mobileprovision"
          echo "PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "Profile UUID: $PP_UUID"

          # Clip profile so multi-target archive can sign
          CLIP_PP_PATH="$RUNNER_TEMP/arclakeclip.mobileprovision"
          python3 - "$CLIP_PP_PATH" << 'PYEOF' || true
          import jwt, time, json, urllib.request, base64, sys, os
          key = open(os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8")).read()
          token = jwt.encode({"iss":"90056871-d791-45f6-a770-21399c45e491","iat":int(time.time()),
              "exp":int(time.time())+1200,"aud":"appstoreconnect-v1"}, key,
              algorithm="ES256", headers={"kid":"NQXQ595W59"})
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/profiles?filter[name]=ArcLakeClipGitHubFlow",
              headers={"Authorization": f"Bearer {token}"})
          d = json.loads(urllib.request.urlopen(req).read())
          prof = d["data"][0]["attributes"]
          open(sys.argv[1], "wb").write(base64.b64decode(prof["profileContent"]))
          print(f"Fetched clip profile UUID: {prof['uuid']}")
          PYEOF
          CLIP_PP_UUID=$(security cms -D -i "$CLIP_PP_PATH" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || true)
          if [ -n "$CLIP_PP_UUID" ]; then
            cp "$CLIP_PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$CLIP_PP_UUID.mobileprovision"
            echo "Clip profile UUID: $CLIP_PP_UUID"
          fi

      - name: Install xcodegen
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null || true
          xcodegen version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -project ArcLake.xcodeproj -list

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ArcLake.xcodeproj \
            -scheme ArcLakeApp

      - name: Archive
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KP="${KEYCHAIN_PASSWORD:-keychainpass}"
          security unlock-keychain -p "$KP" $RUNNER_TEMP/signing.keychain-db
          echo "GIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          xcodebuild archive \
            -project ArcLake.xcodeproj \
            -scheme ArcLakeApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ArcLake.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db"
          ls -la "$RUNNER_TEMP/ArcLake.xcarchive"

      - name: Ensure SIWA entitlements on signed app
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          APP=$(find "$RUNNER_TEMP/ArcLake.xcarchive/Products/Applications" -name "*.app" | head -1)
          echo "APP=$APP"
          chmod +x scripts/ensure_siwa_entitlements.sh
          scripts/ensure_siwa_entitlements.sh "$APP" "$RUNNER_TEMP/siwa-ents" "$RUNNER_TEMP/signing.keychain-db"

      - name: Package IPA (no upload)
        run: |
          ARCHIVE="$RUNNER_TEMP/ArcLake.xcarchive"
          APP=$(find "$ARCHIVE/Products/Applications" -name "*.app" | head -1)
          echo "Packaging: $APP"
          echo "APP_PATH=$APP" >> $GITHUB_ENV
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "ArcLake.ipa" Payload/
          ls -la "$RUNNER_TEMP/ArcLake.ipa"

      - name: Dump + gate SIWA entitlements
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/siwa-ents"
          mkdir -p "$OUT"
          APP="$APP_PATH"
          if [ -z "${APP:-}" ] || [ ! -d "$APP" ]; then
            APP=$(find "$RUNNER_TEMP/ArcLake.xcarchive/Products/Applications" -name "*.app" | head -1)
          fi
          echo "App: $APP"
          echo "Git SHA: $(git rev-parse HEAD)"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "Binary: $BIN"

          echo "=== 1) signed binary entitlements (codesign) ==="
          codesign --display --entitlements :- "$APP" > "$OUT/signed-binary-entitlements.xml" 2>"$OUT/codesign-stderr.txt" || true
          if [ ! -s "$OUT/signed-binary-entitlements.xml" ]; then
            codesign --display --entitlements :- "$BIN" > "$OUT/signed-binary-entitlements.xml" 2>>"$OUT/codesign-stderr.txt" || true
          fi
          cat "$OUT/signed-binary-entitlements.xml"
          echo "--- codesign stderr ---"
          cat "$OUT/codesign-stderr.txt" || true

          echo ""
          echo "=== 2) embedded.mobileprovision Entitlements ==="
          PP="$APP/embedded.mobileprovision"
          if [ ! -f "$PP" ]; then
            echo "ERROR: embedded.mobileprovision missing at $PP"
            echo "SIWA_IPA_ENTITLEMENTS: FAIL — missing embedded.mobileprovision"
            exit 1
          fi
          security cms -D -i "$PP" > "$OUT/embedded-profile.plist"
          plutil -extract Entitlements xml1 -o "$OUT/embedded-profile-entitlements.xml" "$OUT/embedded-profile.plist"
          plutil -p "$OUT/embedded-profile-entitlements.xml"
          cat "$OUT/embedded-profile-entitlements.xml"

          python3 - "$OUT" <<'PY'
          import pathlib, sys, plistlib
          out = pathlib.Path(sys.argv[1])
          signed_raw = (out / "signed-binary-entitlements.xml").read_bytes()
          prof_raw = (out / "embedded-profile-entitlements.xml").read_bytes()

          def load(data: bytes):
              i = data.find(b"<?xml")
              if i < 0:
                  i = data.find(b"bplist")
                  if i >= 0:
                      return plistlib.loads(data[i:])
                  raise ValueError("no plist found")
              return plistlib.loads(data[i:])

          try:
              signed = load(signed_raw)
          except Exception as e:
              print(f"ERROR parsing signed binary entitlements: {e}")
              print("SIWA_IPA_ENTITLEMENTS: FAIL — could not parse signed binary entitlements")
              sys.exit(1)
          try:
              prof = load(prof_raw)
          except Exception as e:
              print(f"ERROR parsing profile entitlements: {e}")
              print("SIWA_IPA_ENTITLEMENTS: FAIL — could not parse embedded profile entitlements")
              sys.exit(1)

          def has_siwa(d):
              v = d.get("com.apple.developer.applesignin")
              if v is None:
                  return False, "KEY ABSENT"
              if isinstance(v, list) and any(str(x) == "Default" for x in v):
                  return True, repr(v)
              return False, f"present but not Default: {v!r}"

          s_ok, s_detail = has_siwa(signed)
          p_ok, p_detail = has_siwa(prof)
          print("")
          print("=== GATE ===")
          print(f"signed binary applesignin: {'PASS' if s_ok else 'FAIL'} — {s_detail}")
          print(f"embedded profile applesignin: {'PASS' if p_ok else 'FAIL'} — {p_detail}")
          print("Signed entitlement keys:", sorted(signed.keys()))
          print("Profile entitlement keys:", sorted(prof.keys()))
          if s_ok and p_ok:
              print("SIWA_IPA_ENTITLEMENTS: PASS")
              sys.exit(0)
          missing = []
          if not s_ok:
              missing.append(f"signed binary: {s_detail}")
          if not p_ok:
              missing.append(f"embedded.mobileprovision: {p_detail}")
          print("SIWA_IPA_ENTITLEMENTS: FAIL — " + "; ".join(missing))
          sys.exit(1)
          PY

      - name: Upload entitlement dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siwa-ipa-entitlements
          path: |
            ${{ runner.temp }}/siwa-ents/
          if-no-files-found: warn

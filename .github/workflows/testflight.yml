name: Build & Deploy ArcLake to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build ArcLake iOS to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8

      - name: Setup keychain, install certificate and provisioning profile
        env:
          CERTIFICATE_BASE64:          ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD:        ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD:           ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          P12_PATH="$RUNNER_TEMP/dist.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$P12_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Fetch the LIVE ArcLakeGitHubFlow profile from ASC API — never stale,
          # always includes current App ID capabilities (Sign in with Apple etc.)
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --user --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyjwt cryptography || true
          PP_PATH="$RUNNER_TEMP/arclake.mobileprovision"
          python3 - "$PP_PATH" << 'PYEOF'
          import jwt, time, json, urllib.request, base64, sys
          key = open(f"{__import__('os').path.expanduser('~')}/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8").read()
          token = jwt.encode({"iss":"90056871-d791-45f6-a770-21399c45e491","iat":int(time.time()),
              "exp":int(time.time())+1200,"aud":"appstoreconnect-v1"}, key,
              algorithm="ES256", headers={"kid":"NQXQ595W59"})
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/profiles?filter[name]=ArcLakeGitHubFlow",
              headers={"Authorization": f"Bearer {token}"})
          d = json.loads(urllib.request.urlopen(req).read())
          prof = d["data"][0]["attributes"]
          open(sys.argv[1], "wb").write(base64.b64decode(prof["profileContent"]))
          print(f"Fetched profile UUID: {prof['uuid']}")
          PYEOF
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(security cms -D -i "$PP_PATH" 2>/dev/null | \
            plutil -extract UUID raw - 2>/dev/null)
          if [ -z "$PP_UUID" ]; then
            echo "ASC fetch failed — falling back to secret profile"
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
            PP_UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          fi
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID.mobileprovision"
          echo "PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "Profile UUID: $PP_UUID"

          # Same pattern, second profile — the App Clip target signs with
          # its own bundle ID and needs its own profile installed alongside
          # the main app's. xcodebuild picks the right one per target based
          # on each target's own PROVISIONING_PROFILE_SPECIFIER in project.yml.
          CLIP_PP_PATH="$RUNNER_TEMP/arclakeclip.mobileprovision"
          python3 - "$CLIP_PP_PATH" << 'PYEOF'
          import jwt, time, json, urllib.request, base64, sys
          key = open(f"{__import__('os').path.expanduser('~')}/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8").read()
          token = jwt.encode({"iss":"90056871-d791-45f6-a770-21399c45e491","iat":int(time.time()),
              "exp":int(time.time())+1200,"aud":"appstoreconnect-v1"}, key,
              algorithm="ES256", headers={"kid":"NQXQ595W59"})
          req = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/profiles?filter[name]=ArcLakeClipGitHubFlow",
              headers={"Authorization": f"Bearer {token}"})
          d = json.loads(urllib.request.urlopen(req).read())
          prof = d["data"][0]["attributes"]
          open(sys.argv[1], "wb").write(base64.b64decode(prof["profileContent"]))
          print(f"Fetched clip profile UUID: {prof['uuid']}")
          PYEOF
          CLIP_PP_UUID=$(security cms -D -i "$CLIP_PP_PATH" 2>/dev/null | \
            plutil -extract UUID raw - 2>/dev/null)
          if [ -n "$CLIP_PP_UUID" ]; then
            cp "$CLIP_PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$CLIP_PP_UUID.mobileprovision"
            echo "Clip profile UUID: $CLIP_PP_UUID"
          else
            echo "Clip profile fetch failed — App Clip target will fail to sign"
          fi

      - name: Install xcodegen 2.42.0
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null || true
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ArcLake.xcodeproj -scheme ArcLakeApp

      - name: Archive
        run: |
          PP_FINAL="${PROFILE_UUID}"
          /usr/local/bin/xcodegen generate || echo "xcodegen already ran"
          # Signing settings live in project.yml target settings — passing them on the
          # CLI applies globally and breaks SPM package targets (GoogleSignIn/AppAuth
          # "does not support provisioning profiles"). Only the keychain flag is global-safe.
          xcodebuild archive \
            -project ArcLake.xcodeproj \
            -scheme ArcLakeApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ArcLake.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db"
          ls -la "$RUNNER_TEMP/ArcLake.xcarchive"

      - name: Export IPA
        run: |
          # Package IPA directly from archive (Xcode 26 exportArchive method change)
          ARCHIVE="$RUNNER_TEMP/ArcLake.xcarchive"
          APP=$(find "$ARCHIVE/Products/Applications" -name "*.app" | head -1)
          echo "Packaging: $APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "ArcLake.ipa" Payload/
          ls -la "$RUNNER_TEMP/ArcLake.ipa"

      - name: Upload to TestFlight
        run: |
          RESULT=$(xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/ArcLake.ipa" \
            --apiKey "NQXQ595W59" \
            --apiIssuer "90056871-d791-45f6-a770-21399c45e491" \
            --apiKeyPath ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8 2>&1)
          echo "$RESULT"
          # Fail only on actual upload failure (not "No errors" false positive)
          if echo "$RESULT" | grep -iE "UPLOAD FAILED|State_Error|Validation failed|^.*ERROR:" | grep -v "No errors"; then
            echo "Upload failed — see above"; exit 1
          fi
          echo "✓ Upload accepted"

  build-dart:
    uses: DART-Skyboard/DART-iOS/.github/workflows/testflight.yml@main
    secrets:
      CERTIFICATE_BASE64:             ${{ secrets.CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD:           ${{ secrets.CERTIFICATE_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      DART_PROFILE_BASE64:            ${{ secrets.DART_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD:              ${{ secrets.KEYCHAIN_PASSWORD }}

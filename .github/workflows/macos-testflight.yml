name: Build & Deploy ArcLake macOS to TestFlight

# ═══════════════════════════════════════════════════════════════════
# PREREQUISITES — Add these two secrets in GitHub repo settings:
#   MAC_CERTIFICATE_BASE64  — Base64 of "Mac App Distribution" .p12 cert
#                             From: developer.apple.com → Certificates → Mac App Distribution
#   MAC_PROFILE_BASE64      — Base64 of macOS App Store provisioning profile (.provisionprofile)
#                             From: developer.apple.com → Profiles → Mac App Store
#                             App ID: DART-Meadow-LLC.Cotharticren
#                             Cert: Mac App Distribution (created above)
#                             Name: ArcLakeMacFlow
#
# All other secrets (CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD, APP_STORE_CONNECT_*)
# are already in the repo from the iOS build.
# ═══════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build ArcLake macOS (Catalyst) to TestFlight
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -switch /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8

      - name: Setup keychain + Mac App Distribution cert + macOS profile
        env:
          MAC_CERTIFICATE_BASE64:  ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD:    ${{ secrets.CERTIFICATE_PASSWORD }}
          MAC_PROFILE_BASE64:      ${{ secrets.MAC_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD:       ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Mac App Distribution certificate
          P12_PATH="$RUNNER_TEMP/mac_dist.p12"
          echo "$MAC_CERTIFICATE_BASE64" | base64 --decode > "$P12_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install macOS App Store provisioning profile
          PP_PATH="$RUNNER_TEMP/arclake_mac.provisionprofile"
          echo "$MAC_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(security cms -D -i "$PP_PATH" 2>/dev/null | \
            plutil -extract UUID raw - 2>/dev/null || echo "")
          if [ -n "$PP_UUID" ]; then
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID.provisionprofile"
            echo "MAC_PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV
            echo "macOS profile UUID: $PP_UUID"
          else
            echo "Warning: could not extract profile UUID"
          fi

          # Confirm cert loaded
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -i "Mac App Distribution" || \
            echo "Warning: Mac App Distribution cert not found"

      - name: Install xcodegen
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null || true
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ArcLake.xcodeproj \
            -scheme ArcLakeMac

      - name: Archive — Mac Catalyst
        run: |
          PP="${MAC_PROFILE_UUID:-}"
          set -o pipefail
          xcodebuild archive \
            -project ArcLake.xcodeproj \
            -scheme ArcLakeMac \
            -configuration Release \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            -archivePath "$RUNNER_TEMP/ArcLakeMac.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Mac App Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="ArcLakeMacFlow" \
            DEVELOPMENT_TEAM=L7AHWS9Q6V \
            SUPPORTS_MACCATALYST=YES \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db" \
            2>&1 | tee /tmp/xcodebuild_mac.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== BUILD ERRORS ==="
            grep -E "error:|BUILD FAILED" /tmp/xcodebuild_mac.log | head -30
            exit 1
          fi
          ls -la "$RUNNER_TEMP/ArcLakeMac.xcarchive"

      - name: Export macOS package
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key>               <string>app-store-connect</string>
            <key>teamID</key>               <string>L7AHWS9Q6V</string>
            <key>destination</key>          <string>export</string>
            <key>signingStyle</key>         <string>manual</string>
            <key>signingCertificate</key>   <string>Mac App Distribution</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ArcLakeMac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/MacExport" 2>&1 | tail -20 || true

          PKG=$(find "$RUNNER_TEMP/MacExport" -name "*.pkg" 2>/dev/null | head -1)
          if [ -z "$PKG" ]; then
            # Fallback: productbuild from archive
            ARCHIVE_APP=$(find "$RUNNER_TEMP/ArcLakeMac.xcarchive/Products" -name "*.app" | head -1)
            PKG="$RUNNER_TEMP/ArcLakeMac.pkg"
            productbuild --component "$ARCHIVE_APP" /Applications "$PKG" 2>&1 || true
          fi
          echo "PKG_PATH=$PKG" >> $GITHUB_ENV
          ls -la "$PKG" || echo "No PKG produced"

      - name: Upload to App Store Connect
        run: |
          RESULT=$(xcrun altool --upload-app \
            --type osx \
            --file "$PKG_PATH" \
            --apiKey "NQXQ595W59" \
            --apiIssuer "90056871-d791-45f6-a770-21399c45e491" \
            --apiKeyPath ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8 2>&1)
          echo "$RESULT"
          if echo "$RESULT" | grep -iE "UPLOAD FAILED|State_Error|Validation failed" | grep -v "No errors"; then
            echo "Upload failed — see above"; exit 1
          fi
          echo "✓ Arc Lake macOS v1.5.2 (274) submitted to App Store Connect TestFlight"

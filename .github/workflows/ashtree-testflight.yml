name: Build Ash Tree IDE for TestFlight

on:
  workflow_dispatch:

jobs:
  build-ashtreeide:
    name: Build Ash Tree IDE
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout AshtreeIDE-iOS
        uses: actions/checkout@v4
        with:
          repository: DART-Skyboard/AshtreeIDE-iOS
          token: ${{ secrets.GH_PAT }}

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install ASC API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/private_keys ~/.private_keys
          printf '%s' "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8 ~/private_keys/
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8

      - name: Install cert + Ash Tree profile
        env:
          CERTIFICATE_BASE64:     ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD:   ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD:      ${{ secrets.KEYCHAIN_PASSWORD }}
          ASHTREE_PROFILE_BASE64: ${{ secrets.ASHTREE_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ashtree-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$ASHTREE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/ashtree.mobileprovision"
          cp "$RUNNER_TEMP/ashtree.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/3d6f3884-df17-4871-afc1-e1edcedc7335.mobileprovision
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Install xcodegen 2.42.0
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip \
            -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_bin
          sudo cp /tmp/xcodegen_bin/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Bump build number
        run: |
          BUILD=$(date +%Y%m%d%H%M)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" \
            Sources/AshtreeIDEApp/Info.plist
          echo "BUILD_NUMBER=$BUILD" >> $GITHUB_ENV

      - name: Archive (full output for error diagnosis)
        run: |
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          xcodebuild archive \
            -project AshtreeIDE-iOS.xcodeproj \
            -scheme AshtreeIDE-iOS \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AshtreeIDE.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="3d6f3884-df17-4871-afc1-e1edcedc7335" \
            DEVELOPMENT_TEAM=L7AHWS9Q6V \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/ashtree-signing.keychain-db"
          echo "=== Archive contents ==="
          find "$RUNNER_TEMP/AshtreeIDE.xcarchive/Products" -type f | sort

      - name: Package IPA
        run: |
          ARCHIVE="$RUNNER_TEMP/AshtreeIDE.xcarchive"
          APP=$(find "$ARCHIVE/Products/Applications" -name "*.app" | head -1)
          echo "Packaging: $APP"
          ls -la "$APP/"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qr "AshtreeIDE.ipa" Payload/
          echo "IPA size: $(du -sh $RUNNER_TEMP/AshtreeIDE.ipa)"

      - name: Upload to TestFlight
        run: |
          RESULT=$(xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/AshtreeIDE.ipa" \
            --apiKey "NQXQ595W59" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --apiKeyPath ~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8 2>&1)
          echo "$RESULT"
          if echo "$RESULT" | grep -iE "UPLOAD FAILED|State_Error|Validation failed" | grep -v "No errors"; then
            exit 1
          fi
          echo "✓ Build ${{ env.BUILD_NUMBER }} uploaded to TestFlight"

      - name: Submit to App Store Review
        env:
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          pip install PyJWT cryptography --quiet --break-system-packages 2>/dev/null || true
          cat > /tmp/asc_submit.py << 'ASCEOF'
import jwt, time, urllib.request, urllib.error, json, sys, os

KEY_ID   = "NQXQ595W59"
ISSUER   = os.environ["ASC_ISSUER"]
APP_ID   = "6780086515"
KEY_PATH = os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey_NQXQ595W59.p8")

with open(KEY_PATH, "r") as f:
    private_key = f.read()

def make_token():
    return jwt.encode(
        {"iss": ISSUER, "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"},
        private_key, algorithm="ES256", headers={"kid": KEY_ID, "typ": "JWT"})

def asc(path, method="GET", body=None):
    token = make_token()
    req = urllib.request.Request(
        f"https://api.appstoreconnect.apple.com/v1{path}",
        data=json.dumps(body).encode() if body else None,
        method=method,
        headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
    try:
        with urllib.request.urlopen(req) as r: return json.loads(r.read())
    except urllib.error.HTTPError as e:
        print(f"ASC {method} {path} -> {e.code}: {e.read().decode()[:200]}")
        return None

print("Waiting for build to process (up to 15 min)...")
build_id = None
for attempt in range(30):
    time.sleep(30)
    builds = asc(f"/builds?filter[app]={APP_ID}&filter[processingState]=VALID&limit=5&sort=-uploadedDate")
    if builds and builds.get("data"):
        build_id = builds["data"][0]["id"]
        print(f"Build processed: {build_id}")
        break
    print(f"  [{(attempt+1)*30}s] Still processing...")

if not build_id:
    print("Build not yet processed. Submit manually in App Store Connect.")
    sys.exit(0)

versions = asc(f"/apps/{APP_ID}/appStoreVersions?filter[platform]=IOS&limit=5")
version_id = None
if versions and versions.get("data"):
    for v in versions["data"]:
        state = v["attributes"]["appStoreState"]
        if state in ["READY_FOR_SUBMISSION","PREPARE_FOR_SUBMISSION","DEVELOPER_REJECTED","REJECTED"]:
            version_id = v["id"]
            print(f"Version {v['attributes']['versionString']} in state {state}")
            break

if not version_id:
    print("No version ready for submission. Check App Store Connect.")
    sys.exit(0)

print(f"Attaching build {build_id} to version {version_id}...")
asc(f"/appStoreVersions/{version_id}/relationships/build", method="PATCH",
    body={"data": {"type": "builds", "id": build_id}})

print("Submitting for review...")
result = asc("/appStoreVersionSubmissions", method="POST",
    body={"data": {"type": "appStoreVersionSubmissions", "relationships": {
        "appStoreVersion": {"data": {"type": "appStoreVersions", "id": version_id}}}}})
if result and result.get("data"):
    print("SUCCESS: Submitted for App Store Review")
    print(f"Submission ID: {result['data']['id']}")
else:
    print("Could not auto-submit. Check App Store Connect manually.")
ASCEOF
          python3 /tmp/asc_submit.py
